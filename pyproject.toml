[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-contradict"
version = "0.1.0"
description = "Academic Research Contradiction Detection CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer[all]",
    "rich",
    "pymupdf",
    "openai",
    "pydantic"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lit_contradict*", "eval*"]

[project.scripts]
lit-contradict = "cli:app"